      <!-- ── THE MEMORY: 2008 → 2026 ──
           Two photographs and one continuous stroke of ink between
           them. No eyebrow, no title, no captions beyond the years —
           anything else here would be the section talking about
           itself. The path is built from the rendered geometry at
           runtime (see renderMemory), so it always meets the corners
           of the real prints, whatever size they are. -->
      <section id="memory" class="section section--memory">
        <svg class="memory-ink" viewBox="0 0 1000 3200"
             preserveAspectRatio="none" aria-hidden="true">
          <path id="memoryPath" d="" pathLength="100"/>
        </svg>

        <figure class="memory-photo memory-photo--start" id="memoryStart">
          <div class="memory-print"><div class="memory-img" id="memoryStartImg"></div></div>
          <figcaption class="memory-year" id="memoryStartYear"></figcaption>
        </figure>

        <figure class="memory-photo memory-photo--end" id="memoryEnd">
          <div class="memory-print"><div class="memory-img" id="memoryEndImg"></div></div>
          <figcaption class="memory-year" id="memoryEndYear"></figcaption>
        </figure>
      </section>


      <!-- ── VOICE NOTES ── -->
      <section id="voice-notes" class="section section--audio">
        <div class="section-inner reveal-up">
          <p  class="eyebrow"      >In My Voice</p>
          <h2 class="section-title">I Sang It For You</h2>
          <div class="audio-cards" id="audioCards"></div>
        </div>
      </section>


      <!-- ── LITTLE THINGS ── -->
      <section id="little-things" class="section section--little-things">
        <div class="section-inner reveal-up">
          <p  class="eyebrow"      >The Details That Make You, You</p>
          <h2 class="section-title">The Little Things</h2>
        </div>
        <div class="things-grid" id="thingsGrid"></div>
      </section>


      <!-- ── FOUR WORDS ── -->
      <section id="four-words" class="section section--words">
        <div class="words-container">
          <p class="words-eyebrow reveal-up" id="wordsEyebrow"></p>
          <!-- The question comes first: it frames the four words as
               her answer, rather than explaining them afterwards. -->
          <div class="words-intro reveal-up">
            <p class="words-main-line" id="wordsMainLine"></p>
            <p class="words-sub-line"  id="wordsSubLine"></p>
          </div>
          <div id="fourWordsWrap"></div>
        </div>
      </section>

          <div class="final-letter-wrap reveal-up">
            <div class="final-letter-header">
              <div class="floral-rule">
                <span>✦</span><span class="rule-line"></span>
                <span class="rule-flower">❀</span>
                <span class="rule-line"></span><span>✦</span>
              </div>
              <p class="final-to" id="finalAddressee"></p>
            </div>

            <div class="final-letter-body" id="finalLetterBody"></div>

            <!-- No signature here. The letter ends on "Open it.", and
                 signing off between that and the envelope would answer
                 the invitation before she takes it — the hidden letter
                 signs itself a minute later. Only the date remains. -->
            <div class="final-letter-footer">
              <div class="final-date">
                <p class="final-date-text" id="finalDate"></p>
              </div>
            </div>
          </div>

          <div class="closing-flowers reveal-up">
            <span class="closing-flower">✿</span>
            <span class="closing-flower">❀</span>

            <span class="closing-flower">✿</span>

    </main>


    <!-- ── LIGHTBOX ── -->
    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
      <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
      <div class="lightbox-content">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
        <div class="lightbox-photo">
          <div class="lightbox-placeholder" id="lightboxPlaceholder"></div>
        </div>
        <p class="lightbox-caption" id="lightboxCaption"></p>
      </div>
    </div>


    <!-- ════════════════════════════════════════════
         HIDDEN LETTER OVERLAY
         Sits above everything. Triggered by scroll
         into #final-letter. Entirely self-playing.
    ════════════════════════════════════════════ -->
    <div id="letterOverlay" class="letter-overlay" aria-hidden="true">

      <!-- SVG defs for wax seal texture -->
      <svg width="0" height="0" style="position:absolute;pointer-events:none;">
        <defs>
          <filter id="waxNoise">
            <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="5" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
          </filter>
          <radialGradient id="waxFill" cx="36%" cy="30%" r="78%">
            <stop offset="0%" stop-color="#b05570"/>
            <stop offset="55%" stop-color="#823449"/>
            <stop offset="100%" stop-color="#5e2538"/>
          </radialGradient>
        </defs>
      </svg>

      <!-- ACT 3: the warm wash. A separate layer that simply fades in,
           rather than animating the overlay's own background — gradient
           transitions are not reliably interpolated, and opacity is
           GPU-composited, which is the rule the rest of this sequence
           already follows. -->
      <div id="lo-warmwash" class="lo-warmwash"></div>

      <!-- ACT 2: whisper line -->
      <div id="lo-whisper" class="lo-whisper">
        <p id="lo-whisperText" class="lo-whisper-text"></p>
      </div>

      <!-- ACT 3: warm dark bg (rendered via CSS background on overlay) -->

      <!-- ACT 4: envelope -->
      <div id="lo-envelope" class="lo-envelope">
        <!-- body -->
        <div class="lo-env-body"></div>
        <!-- bottom triangle depth -->
        <div class="lo-env-bottom"></div>
        <!-- diagonal seams -->
        <div class="lo-env-seam lo-env-seam--left"></div>
        <div class="lo-env-seam lo-env-seam--right"></div>
        <!-- flap shadow -->
        <div id="lo-flapShadow" class="lo-flap-shadow"></div>
        <!-- flap -->
        <div id="lo-flap" class="lo-flap"></div>
        <!-- wax seal -->
        <div id="lo-wax" class="lo-wax">
          <svg width="52" height="52" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="24" fill="url(#waxFill)" filter="url(#waxNoise)"/>
            <circle cx="26" cy="26" r="24" fill="none" stroke="#8a4055" stroke-width="1" opacity="0.5"/>
            <circle cx="26" cy="26" r="20" fill="none" stroke="#5e2538" stroke-width="1.5" opacity="0.6"/>
            <ellipse cx="20" cy="18" rx="9" ry="6" fill="#c0708a" opacity="0.3"/>
            <text x="26" y="35" text-anchor="middle" font-family="Dancing Script,cursive" font-size="28" font-weight="700" fill="#3e1c2a" opacity="0.85">A</text>
            <text x="25.3" y="34.3" text-anchor="middle" font-family="Dancing Script,cursive" font-size="28" font-weight="700" fill="#f0c4d2" opacity="0.38">A</text>
          </svg>
        </div>
      </div>

      <!-- ACT 4: the letter paper -->
      <div id="lo-paper" class="lo-paper">
        <!-- texture layers -->
        <div class="lo-paper-fibre"></div>
        <div class="lo-paper-light"></div>
        <div class="lo-paper-lines"></div>
        <div class="lo-paper-fold"></div>

        <!-- pressed gerbera corner -->
        <div class="lo-gerbera">
          <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" opacity="0.85">
            <g transform="translate(40 40)">
              <g fill="#cf8098">
                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(0)"/>
                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(30)"/>
                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(60)"/>
                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(90)"/>
                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(120)"/>
                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(150)"/>

                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(210)"/>

                <ellipse cx="0" cy="-26" rx="5" ry="22" transform="rotate(270)"/>

              </g>
              <g fill="#dd9bb0">
                <ellipse cx="0" cy="-18" rx="3.5" ry="15" transform="rotate(15)"/>

                <ellipse cx="0" cy="-18" rx="3.5" ry="15" transform="rotate(135)"/>
                <ellipse cx="0" cy="-18" rx="3.5" ry="15" transform="rotate(195)"/>
                <ellipse cx="0" cy="-18" rx="3.5" ry="15" transform="rotate(255)"/>
                <ellipse cx="0" cy="-18" rx="3.5" ry="15" transform="rotate(315)"/>
              </g>
              <circle cx="0" cy="0" r="9" fill="#9c5870"/>
              <circle cx="0" cy="0" r="5" fill="#7e4459"/>
            </g>
          </svg>
        </div>

        <!-- letter content -->
        <p class="lo-byhand">for avline · written by hand</p>
        <div id="lo-lines" class="lo-lines"></div>
      </div>

      <!-- drifting petal (Act 2) -->
      <div id="lo-petal" class="lo-petal">
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="20" cy="30" rx="11" ry="27" fill="#c87a96" opacity="0.92"/>
          <ellipse cx="20" cy="30" rx="6" ry="24" fill="#d894ac" opacity="0.7"/>
          <path d="M20 56 Q17 36 20 8 Q23 36 20 56" fill="#a85a76" opacity="0.4"/>
        </svg>
      </div>

      <!-- ambient petals (Act 4) -->
      <div class="lo-amb lo-amb--1">
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="20" cy="30" rx="10" ry="24" fill="#c87a96" opacity="0.8"/>

        </svg>
      </div>
      <div class="lo-amb lo-amb--2">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(40 40)" opacity="0.7">
            <g fill="#b87090">
              <ellipse cx="0" cy="-16" rx="3.5" ry="13" transform="rotate(0)"/>
              <ellipse cx="0" cy="-16" rx="3.5" ry="13" transform="rotate(45)"/>

              <ellipse cx="0" cy="-16" rx="3.5" ry="13" transform="rotate(135)"/>
              <ellipse cx="0" cy="-16" rx="3.5" ry="13" transform="rotate(180)"/>
              <ellipse cx="0" cy="-16" rx="3.5" ry="13" transform="rotate(225)"/>
              <ellipse cx="0" cy="-16" rx="3.5" ry="13" transform="rotate(270)"/>
              <ellipse cx="0" cy="-16" rx="3.5" ry="13" transform="rotate(315)"/>
            </g>
            <circle cx="0" cy="0" r="6" fill="#9c5870"/>
          </g>
        </svg>
      </div>

    </div><!-- /letterOverlay -->
